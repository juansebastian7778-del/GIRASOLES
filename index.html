(function makeStars(
  count = 2000,
  spread = 3000
) {

  const geometry =
    new THREE.BufferGeometry();

  const positions =
    new Float32Array(count * 3);

  for (let i = 0; i < count; i++) {

    const r =
      spread * (
        0.3 +
        Math.random() * 0.7

    const theta =
      Math.random() * Math.PI * 2;

      r *
      Math.sin(phi) *
      Math.cos(theta);

    positions[i * 3 + 1] =
      r *
      Math.cos(phi);

    positions[i * 3 + 2] =
      r *
      Math.sin(phi) *
      Math.sin(theta);
  }

  geometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
      positions,
      3
    )
  );

      geometry,
      new THREE.PointsMaterial({

function makeGlow(
  size = 768,
  c1 = "255,235,130",

) {

  const c =

  c.width = size;
  c.height = size;

    ctx.createRadialGradient(

    );

    0,
    size,

  );

  return new THREE.CanvasTexture(c);
}

function ringTexture(
  size = 1024
) {

  const c =
    document.createElement("canvas");

  c.width = size;
  c.height = size;

  const ctx =
    c.getContext("2d");

  ctx.translate(
    size / 2,
    size / 2
  );

  const rInner =
    size * 0.205;

  const rOuter =
    size * 0.49;

  const gradient =
    ctx.createRadialGradient(
      0,
      0,
      rInner,
      0,
      0,
      rOuter
    );

  gradient.addColorStop(
    0.00,
    "rgba(255,255,245,1)"
  );

  gradient.addColorStop(
    0.30,
    "rgba(255,235,120,1)"
  );

  gradient.addColorStop(
    0.65,
    "rgba(255,200,40,0.95)"
  );

  gradient.addColorStop(
    1.00,
    "rgba(255,160,0,0.85)"
  );

  ctx.fillStyle = gradient;

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    rOuter,
    0,
    Math.PI * 2
  );

  ctx.arc(
    0,
    0,
    rInner,
    0,
    Math.PI * 2,
    true
  );

  ctx.closePath();

  ctx.fill();


  /* Franjas */
  const bandCount = 26;

  for (
    let i = 0;
    i < bandCount;
    i++
  ) {

    const r =
      rInner +
      (rOuter - rInner) *
      (i / (bandCount - 1));

    const dark =
      i % 3 === 0;

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      r,
      0,
      Math.PI * 2
    );

    ctx.lineWidth =
      (rOuter - rInner) /
      bandCount *
      (
        0.55 +
        Math.random() * 0.35
      );

    ctx.strokeStyle =
      dark
        ? "rgba(110,60,0,0.20)"
        : "rgba(255,255,225,0.16)";

    ctx.stroke();
  }

  return new THREE.CanvasTexture(c);
}

function makeTextTexture(
  text,
  color
) {

  const c =
    document.createElement("canvas");

  c.width = 512;
  c.height = 128;

  const ctx =
    c.getContext("2d");

  ctx.clearRect(
    0,
    0,
    c.width,
    c.height
  );

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.fillStyle = "#fff";

  ctx.shadowColor = color;
  ctx.shadowBlur = 30;

  const maxWidth =
    c.width - 48;

  let fontSize = 60;

  ctx.font =
    fontSize +
    "px 'Indie Flower', cursive";

  while (
    ctx.measureText(text).width >
      maxWidth &&
    fontSize > 24
  ) {

    fontSize -= 2;

    ctx.font =
      fontSize +
      "px 'Indie Flower', cursive";
  }

  ctx.fillText(
    text,
    c.width / 2,
    c.height / 2
  );

  return new THREE.CanvasTexture(c);
}

/* ============================================================

/* ============================================================
   ACTUALIZAR FOTOS
   ============================================================ */

function updatePhotoDOM() {

  photoItems.forEach(
    (photo, index) => {

      photo.theta +=
        photo.speed;


      const x =
        photo.radius *
        Math.sin(photo.phi) *
        Math.cos(photo.theta);

      const y =
        photo.radius *
        Math.cos(photo.phi);

      const z =
        photo.radius *
        Math.sin(photo.phi) *
        Math.sin(photo.theta);


      const projected =
        new THREE.Vector3(
          x,
          y,
          z
        );

      projected.project(
        camera
      );


      if (
        projected.z < -1 ||
        projected.z > 1
      ) {

        photo.element.style.opacity =
          "0";

        return;
      }


      const screenX =
        (
          projected.x *
          0.5 +
          0.5
        ) *
        window.innerWidth;

      const screenY =
        (
          -projected.y *
          0.5 +
          0.5
        ) *
        window.innerHeight;


      photo.element.style.left =
        screenX + "px";

      photo.element.style.top =
        screenY + "px";


      const depthScale =
        Math.max(
          0.75,
          Math.min(
            1.25,
            1 -
            projected.z *
            0.15
          )
        );


      photo.element.style.width =
        (
          photo.size *
          depthScale
        ) + "px";


      photo.element.style.opacity =
        0.88 +
        0.12 *
        Math.sin(
          t * 2 + index
        );

            100
          )
        );

}


/* ============================================================
   CONTROLES DE CÁMARA
   ============================================================ */

let dragging = false;
let lastX = 0;
let lastY = 0;

function onDown(e) {

  dragging = true;

  const point =
    e.touches
      ? e.touches[0]
      : e;

  lastX =
    point.clientX;

  lastY =
    point.clientY;
}


function onMove(e) {

  if (!dragging)
    return;

  const point =
    e.touches
      ? e.touches[0]
      : e;

  const dx =
    (
      point.clientX -
      lastX
    ) /
    window.innerWidth;

  const dy =
    (
      point.clientY -
      lastY
    ) /
    window.innerHeight;


  rotY -=
    dx * 5;

  rotX =
    Math.max(
      -1.2,
      Math.min(
        1.2,
        rotX +
        dy * 3.5
      )
    );


  lastX =
    point.clientX;

  lastY =
    point.clientY;
}


function onUp() {
  dragging = false;
}

  "mousedown",
  onDown
);

addEventListener(
  "mousemove",
  onMove
);

addEventListener(
  "mouseup",
  onUp
);

);

addEventListener(

);

);


/* Zoom */

  "wheel",
  (e) => {

      e.deltaY * 0.25;

    targetDist =
      Math.max(
        160,
        Math.min(
          600,
          targetDist
        )
      );
  },
  {
    passive: true
  }
);


/* ============================================================
   ZOOM CON PELLIZCO
   ============================================================ */

let pinch = 0;

addEventListener(
  "touchmove",
  (e) => {

    if (
      e.touches &&
      e.touches.length === 2
    ) {

      e.preventDefault();

      const dx =
        e.touches[0].clientX -
        e.touches[1].clientX;

      const dy =
        e.touches[0].clientY -
        e.touches[1].clientY;

      const distance =
        Math.hypot(
          dx,
          dy
        );


      if (pinch) {

        targetDist +=
          (pinch - distance) *
          0.5;

        targetDist =
          Math.max(
            160,
            Math.min(
              600,
              targetDist
            )
          );
      }

      pinch =
        distance;
    }
  },
  {
    passive: false
  }
);


addEventListener(
  "touchend",
  () => {
    pinch = 0;
  },
  {
    passive: true
  }
);


/* ============================================================
   ANIMACIÓN
   ============================================================ */

let t = 0;

function tick() {

  requestAnimationFrame(
    tick
  );

  t += 0.01;


  /* Anillo */
  ring.rotation.z +=
    0.003;


  /* Glow */
  const glowScale =
    GLOW_BASE *
    (
      1 +
      Math.sin(t * 0.4) *
      0.03
    );

  glow.scale.set(
    glowScale,
    glowScale,
    1
  );


  /* Núcleo */
  const s =
    1 +
    0.05 *
    Math.sin(t * 3);

  core.scale.set(
    s,
    s,
    s
  );


  /* Frases */
  textGroup.children.forEach(
    (sprite) => {

      sprite.material.opacity =
        0.8 +
        0.2 *
        Math.sin(t * 2);

      sprite.userData.theta +=
        sprite.userData.speed;


      sprite.position.x =
        sprite.userData.radius *
        Math.sin(
          sprite.userData.phi
        ) *
        Math.cos(
          sprite.userData.theta
        );


      sprite.position.z =
        sprite.userData.radius *
        Math.sin(
          sprite.userData.phi
        ) *
        Math.sin(
          sprite.userData.theta
        );
    }
  );


  /* Cámara */
  currentDist +=
    (
      targetDist -
      currentDist
    ) *
    0.06;


  const cx =
    Math.cos(rotX);

  const sx =
    Math.sin(rotX);

  const cy =
    Math.cos(rotY);

  const sy =
    Math.sin(rotY);


  camera.position.set(
    currentDist *
      sy *
      cx,

    currentDist *
      sx,

    currentDist *
      cy *
      cx
  );

  camera.lookAt(
    0,
    0,
    0
  );


  /* Fotos */
  updatePhotoDOM();


  /* Render */
  renderer.render(
    scene,
    camera
  );
}
